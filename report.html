<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Issue - CivicSync</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/report.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="report-body">
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <nav class="navbar">
        <a href="/" class="logo" id="homeLink">Civic<span>Sync</span></a>
        <div class="nav-links">
            <a href="#" id="backDashboard" class="btn btn-outline"
                style="padding: 0.5rem 1rem; font-size: 0.85rem;">Back to Dashboard</a>
            <div class="user-avatar" id="userAvatar">U</div>
        </div>
    </nav>

    <main class="chat-container">
        <div class="chat-wrapper card">
            <div class="chat-header">
                <div><i class="fa-solid fa-headset" style="color: var(--primary);"></i> CivicSync Assistant</div>
                <div style="font-size: 0.85rem; color: var(--text-muted);">Secure Automated Helpline</div>
            </div>

            <div class="chat-messages" id="chatArea">
                <!-- Messages will be injected here by JS -->
            </div>

            <div class="chat-input-area">
                <input type="text" id="textInput" placeholder="Describe your issue..."
                    onkeypress="handleKeyPress(event)">
                <button class="icon-btn send-btn" onclick="sendMessage()">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </main>

    <script src="/report.js"></script>
</body>

</html>
